name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install the locked dependency baseline
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check maintenance script formatting
        run: uv run --locked ruff format --check scripts/check_local_links.py
      - name: Check local documentation links
        run: uv run --locked python scripts/check_local_links.py
      - name: Check generated message component types
        run: uv run --locked python scripts/generate_renderer_types.py --check
      - name: Compile Python sources
        run: uv run --locked python -m compileall -q models plugins scripts tools utils
      - name: Check typed runtime boundaries
        run: >-
          uv run --locked ty check
          utils/agent_context.py utils/harness_profiles.py utils/mcp.py
          utils/agents/inputs.py utils/agents/execution.py
          utils/agents/runtime.py utils/agents/runtime_gateway.py
          utils/delivery.py
          plugins/dashboard/api/settings_routes.py
      - name: Test (including real dependency contracts)
        run: >-
          env -u ALL_PROXY -u all_proxy
          -u HTTP_PROXY -u http_proxy
          -u HTTPS_PROXY -u https_proxy
          uv run --locked pytest test/ -q
      - name: Install the locked Playwright browser runtime
        run: uv run --locked playwright install --with-deps chromium --only-shell
      - name: Smoke-test composed message long images
        run: uv run --locked python scripts/check_message_renderer.py --output-dir "${{ runner.temp }}/frontier-ui"
      - name: Check live public media sources (optional network check)
        continue-on-error: true
        timeout-minutes: 2
        run: uv run --locked python scripts/check_message_renderer.py --live-media --output-dir "${{ runner.temp }}/frontier-ui"
      - name: Check public media with Fake-IP DNS (optional network check)
        continue-on-error: true
        timeout-minutes: 2
        run: uv run --locked python scripts/check_message_renderer.py --live-media --fake-ip-dns --output-dir "${{ runner.temp }}/frontier-ui/fake-ip"
      - name: Check Wikipedia frame (optional external availability check)
        continue-on-error: true
        timeout-minutes: 2
        run: uv run --locked python scripts/check_message_renderer.py --live-media --iframe-url "https://zh.wikipedia.org/wiki/%E6%9D%8E%E5%AD%90" --output-dir "${{ runner.temp }}/frontier-ui/wikipedia"
      - name: Upload renderer screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-renderer-qa
          path: ${{ runner.temp }}/frontier-ui
          if-no-files-found: ignore
          retention-days: 7

  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install renderer dependencies
        run: npm ci
      - name: Build checked-in renderer assets
        run: npm run build:check
